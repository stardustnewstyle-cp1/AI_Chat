<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tech AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="topbar-left">
            <span class="dot"></span>
            <span>localhost:8080</span>
        </div>
        <div class="topbar-icons">
            <span>☆</span>
            <span>⎈</span>
            <span>⋯</span>
        </div>
    </header>

    <main class="main">
        <section id="tutorial" class="tutorial-panel">
            <h1>技術特化 AI へようこそ</h1>
            <p>この AI は、プログラミング・AI・設計・アーキテクチャなどの技術質問に特化しています。</p>

            <h2>できること</h2>
            <ul>
                <li>コードの解説</li>
                <li>設計の比較</li>
                <li>アーキテクチャの説明</li>
                <li>手順の提示</li>
                <li>改善案の提示</li>
            </ul>

            <h2>入力例（クリックで入力）</h2>
            <ul class="example-list">
                <li onclick="fill('Python のクラスの仕組みを教えて')">Python のクラスの仕組みを教えて</li>
                <li onclick="fill('REST と GraphQL の違いは？')">REST と GraphQL の違いは？</li>
                <li onclick="fill('非同期処理の設計で気をつける点は？')">非同期処理の設計で気をつける点は？</li>
            </ul>

            <p class="hint">下の入力欄に質問を入力してください。</p>
        </section>

        <div id="result" class="chat-area"></div>
    </main>

    <div class="input-bar">
        <textarea id="userInput" rows="1" placeholder="質問を入力..."></textarea>
        <button onclick="send()">送信</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
