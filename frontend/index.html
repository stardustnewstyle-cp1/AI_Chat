<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tech AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- チュートリアル画面 -->
    <div id="tutorial" class="card tutorial-card">
        <h2>技術特化 AI へようこそ</h2>
        <p>この AI は、プログラミング・AI・設計・アーキテクチャなどの技術質問に特化しています。</p>

        <h3>できること</h3>
        <ul>
            <li>コードの解説</li>
            <li>設計の比較</li>
            <li>アーキテクチャの説明</li>
            <li>手順の提示</li>
            <li>改善案の提示</li>
        </ul>

        <h3>入力例</h3>
        <ul>
            <li>Python のクラスの仕組みを教えて</li>
            <li>REST と GraphQL の違いは？</li>
            <li>非同期処理の設計で気をつける点は？</li>
        </ul>

        <p class="hint">下の入力欄に質問を入力してください。</p>
    </div>

    <!-- 入力欄 -->
    <div class="input-area">
        <input id="userInput" type="text" placeholder="質問を入力..." />
        <button onclick="send()">送信</button>
    </div>

    <!-- 結果表示 -->
    <div id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
