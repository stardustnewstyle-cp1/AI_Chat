<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tech AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="topbar-left">
            <span class="dot"></span>
            <span>localhost:8080</span>
        </div>
        <div class="topbar-icons">
            <span>☆</span>
            <span>⎈</span>
            <span>⋯</span>
        </div>
    </header>

    <main class="main">
        <div id="tutorial" class="tutorial-wrap">
            <div class="tutorial-card">
                <h2>このAIは技術専用です</h2>
                <p>技術に関係ない質問には回答できません。</p>
            </div>

            <div class="tutorial-card">
                <h2>このAIは技術専用です</h2>
                <p>技術に関係ない質問には回答できません。</p>
            </div>
        </div>

        <div id="result" class="chat-area"></div>
    </main>

    <div class="input-bar">
        <textarea id="userInput" rows="1" placeholder="質問を入力..."></textarea>
        <button onclick="send()">送信</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
