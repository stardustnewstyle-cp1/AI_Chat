<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tech AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>

<div class="main">

    <!-- チュートリアル -->
    <div id="tutorial" class="tutorial">
        <div class="tutorial-card">
            <h2>技術特化 AI へようこそ</h2>
            <p>この AI は、プログラミング・AI・設計・アーキテクチャなどの技術質問に特化しています。</p>

            <h3>できること</h3>
            <ul>
                <li>コードの解説</li>
                <li>設計の比較</li>
                <li>アーキテクチャの説明</li>
                <li>手順の提示</li>
                <li>改善案の提示</li>
            </ul>

            <h3>入力例（クリックで入力）</h3>
            <ul>
                <li onclick="fill('Python のクラスの仕組みを教えて')">Python のクラスの仕組みを教えて</li>
                <li onclick="fill('REST と GraphQL の違いは？')">REST と GraphQL の違いは？</li>
                <li onclick="fill('非同期処理の設計で気をつける点は？')">非同期処理の設計で気をつける点は？</li>
            </ul>

            <p class="hint">下の入力欄に質問を入力してください。</p>
        </div>
    </div>

    <!-- チャット表示領域 -->
    <div id="result" class="chat-area"></div>

</div>

<!-- 入力欄（画面下固定） -->
<div class="input-bar">
    <textarea id="userInput" placeholder="質問を入力..." rows="1"></textarea>
    <button onclick="send()">送信</button>
</div>

<script src="script.js"></script>
</body>
</html>
